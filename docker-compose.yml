x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # https://containrrr.dev/watchtower
  watchtower:
    image: containrrr/watchtower
    restart: always
    logging: *default-logging
    # Kept alive-but-stopped by /root/maintenance.sh during its prune
    # window; this label stops docker container prune from deleting it.
    labels:
      edt.maintenance.keep: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60
  # https://hub.docker.com/r/communityfirst/mapeo-icons
  mapeo-icons:
    image: communityfirst/mapeo-icons
    restart: always
    logging: *default-logging
    environment:
      VIRTUAL_HOST: ${DOMAIN_ICONS}
      LETSENCRYPT_HOST: ${DOMAIN_ICONS}
      LETSENCRYPT_EMAIL: ${EMAIL}
      ICONS_TO_DOWNLOAD: ${ICONS_TO_DOWNLOAD}
      NOUN_KEY: ${NOUN_KEY}
      NOUN_SECRET: ${NOUN_SECRET}
      VIRTUAL_PORT: 3000
      CORS: ${CORS}
  # https://hub.docker.com/r/nginxproxy/nginx-proxy
  proxy:
    build: services/nginx-proxy
    restart: always
    logging: *default-logging
    container_name: proxy
    labels:
      com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy: "true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DIR}/app-data/proxy/certs:/etc/nginx/certs:ro
      - ${DIR}/app-data/proxy/vhostd:/etc/nginx/vhost.d
      - ${DIR}/app-data/proxy/html:/usr/share/nginx/html
      - ${DIR}/app-data/proxy/nginx-conf:/etc/nginx/conf.d
      - /var/run/docker.sock:/tmp/docker.sock:ro
  # https://hub.docker.com/r/nginxproxy/acme-companion
  ssl:
    image: nginxproxy/acme-companion:latest
    restart: always
    logging: *default-logging
    container_name: ssl
    environment:
      NGINX_PROXY_CONTAINER: proxy
      DEFAULT_EMAIL: ${EMAIL}
    volumes:
      - ${DIR}/app-data/proxy/certs:/etc/nginx/certs
      - ${DIR}/app-data/proxy/vhostd:/etc/nginx/vhost.d
      - ${DIR}/app-data/proxy/html:/usr/share/nginx/html
      - ${DIR}/app-data/proxy/acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
  # https://filebrowser.org
  filebrowser:
    image: filebrowser/filebrowser:v2.31.2
    restart: always
    logging: *default-logging
    volumes:
      - ${DIR}:/srv
      - ${DIR}/app-data/filebrowser/database.db:/database.db
      - ${DIR}/app-data/filebrowser/config.json:/config.json
    user: "${PUID}:${PGID}"
    environment:
      VIRTUAL_HOST: ${DOMAIN_FILEBROWSER}
      LETSENCRYPT_HOST: ${DOMAIN_FILEBROWSER}
      LETSENCRYPT_EMAIL: ${EMAIL}
  # https://github.com/digidem/mapeo-config-editor-v2
  mapeo-config-editor:
    image: communityfirst/mapeo-config-editor
    restart: always
    logging: *default-logging
    environment:
      VIRTUAL_HOST: ${DOMAIN_MAPEO_EDITOR}
      LETSENCRYPT_HOST: ${DOMAIN_MAPEO_EDITOR}
      LETSENCRYPT_EMAIL: ${EMAIL}
      VIRTUAL_PORT: 3000
    volumes:
      - ${DIR}/app-data/mapeo-config-editor:/tmp/uploads
  # https://github.com/digidem/mapeo-config-builder-api
  mapeo-config-builder-api:
    image: communityfirst/comapeo-config-builder-api
    restart: always
    logging: *default-logging
    # environment:
    #   VIRTUAL_HOST: ${DOMAIN_MAPEO_BUILDER}
    #   LETSENCRYPT_HOST: ${DOMAIN_MAPEO_BUILDER}
    #   LETSENCRYPT_EMAIL: ${EMAIL}
    #   VIRTUAL_PORT: 3000
    ports:
      - 3000:3000
  # https://github.com/digidem/flight-geofence
  # Served at ${DOMAIN_FLIGHT_GEOFENCE} over TLS via nginx-proxy +
  # acme-companion, like the other services above. No host port is
  # published: the dashboard is reachable only through the proxy, so the
  # admin password never crosses the network in clear text.
  flight-geofence:
    image: communityfirst/flight-geofence:v0.6.2
    restart: always
    logging: *default-logging
    # Boundary sync + coverage regeneration peaked at 4.4GB RSS before
    # v0.5.1 (upstream simplify fix); now ~450MB peak during sync, ~20MB
    # idle. Keep the cap as an OOM guard on this 1GB box.
    mem_limit: 850m
    environment:
      VIRTUAL_HOST: ${DOMAIN_FLIGHT_GEOFENCE}
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: ${DOMAIN_FLIGHT_GEOFENCE}
      LETSENCRYPT_EMAIL: ${EMAIL}
      ADMIN_PASSWORD: ${FLIGHT_GEOFENCE_ADMIN_PASSWORD}
      APP_SECRET_KEY: ${FLIGHT_GEOFENCE_APP_SECRET_KEY}
      BIND_ADDRESS: 0.0.0.0
      SESSION_HTTPS_ONLY: "true"
      TRUSTED_HOSTS: ${DOMAIN_FLIGHT_GEOFENCE},localhost,127.0.0.1
      DASHBOARD_BASE_URL: ${FLIGHT_GEOFENCE_DASHBOARD_BASE_URL}
      # Trust the proxy's X-Forwarded-For so login throttling keys on the
      # real client IP instead of the proxy container, which would let one
      # attacker lock every user out. Safe because no host port is
      # published: only containers on this network can reach the app.
      FORWARDED_ALLOW_IPS: "*"
      # FR24 Explorer-plan token: env wins over any interface-saved
      # value and shows as locked (source=environment) in Settings.
      FLIGHTRADAR24_API_KEY: ${FLIGHT_GEOFENCE_FR24_API_KEY}
    volumes:
      - ${DIR}/app-data/flight-geofence:/data
